<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Saerobus · 폰 미리보기</title>
    <style>
      :root {
        --bezel: #0b0b0d;
        --bezel-edge: #2a2a30;
        --bg: radial-gradient(ellipse at top, #2b2f3a 0%, #14161c 60%, #0a0b10 100%);
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #cbd5e1;
        padding: 24px 16px;
        gap: 24px;
        grid-auto-rows: min-content;
      }

      /* Toolbar */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.06);
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
      }
      .toolbar strong { color: #f1f5f9; font-weight: 600; }
      .toolbar small { color: #94a3b8; font-size: 12px; }
      .toolbar button {
        background: rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 4px 12px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .toolbar button:hover { background: rgba(255, 255, 255, 0.18); }
      .toolbar button.active { background: #2563eb; border-color: #1d4ed8; }

      /* Phone frame — proportions roughly an iPhone 14 Pro */
      .phone {
        --w: 390px;
        --h: 844px;
        width: var(--w);
        height: var(--h);
        background: var(--bezel);
        border: 1.5px solid var(--bezel-edge);
        border-radius: 56px;
        padding: 14px;
        box-shadow: var(--shadow);
        position: relative;
        flex-shrink: 0;
      }
      /* Side buttons */
      .phone::before,
      .phone::after {
        content: '';
        position: absolute;
        background: #1a1a1f;
        border-radius: 3px;
      }
      .phone::before { /* power */
        right: -3px;
        top: 180px;
        width: 3px;
        height: 90px;
      }
      .phone::after { /* volume up */
        left: -3px;
        top: 150px;
        width: 3px;
        height: 60px;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 44px;
        overflow: hidden;
        background: #ffffff;
        isolation: isolate;
        /* App UI starts well below the Dynamic Island so headers don't overlap. */
        --safe-top: 80px;
      }
      .phone.size-se .screen { --safe-top: 60px; }
      .phone.size-max .screen { --safe-top: 88px; }

      /* Dynamic Island */
      .island {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 122px;
        height: 36px;
        background: #000;
        border-radius: 20px;
        z-index: 5;
        pointer-events: none;
      }
      iframe {
        position: absolute;
        top: 52px;
        left: 0;
        width: 100%;
        height: calc(100% - 52px);
        border: 0;
        display: block;
      }

      /* Size variants */
      .phone.size-se { --w: 320px; --h: 568px; border-radius: 44px; padding: 10px; }
      .phone.size-se .screen { border-radius: 36px; }
      .phone.size-se .island { width: 100px; height: 28px; top: 10px; }
      .phone.size-se iframe { top: 40px; height: calc(100% - 40px); }

      .phone.size-pro { --w: 390px; --h: 844px; }

      .phone.size-max { --w: 430px; --h: 932px; border-radius: 60px; padding: 16px; }
      .phone.size-max .screen { border-radius: 46px; }
      .phone.size-max iframe { top: 54px; height: calc(100% - 54px); }

      @media (max-width: 480px) {
        .phone { transform: scale(0.85); transform-origin: top center; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <strong>Saerobus</strong>
      <small>폰 미리보기</small>
      <button data-size="size-se">SE</button>
      <button data-size="size-pro" class="active">Pro</button>
      <button data-size="size-max">Max</button>
      <button id="reload">↻</button>
    </div>

    <div class="phone size-pro" id="phone">
      <div class="screen">
        <div class="island"></div>
        <iframe id="app" src="/" title="Saerobus app"></iframe>
      </div>
    </div>

    <script>
      const phone = document.getElementById('phone');
      const buttons = document.querySelectorAll('.toolbar button[data-size]');
      buttons.forEach((b) => {
        b.addEventListener('click', () => {
          phone.classList.remove('size-se', 'size-pro', 'size-max');
          phone.classList.add(b.dataset.size);
          buttons.forEach((x) => x.classList.toggle('active', x === b));
        });
      });
      document.getElementById('reload').addEventListener('click', () => {
        const f = document.getElementById('app');
        f.src = f.src;
      });
    </script>
  </body>
</html>
